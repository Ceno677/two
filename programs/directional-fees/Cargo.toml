[package]
name = "directional-fees"
version = "0.1.0"
description = "Program-controlled directional creator-fee custody"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "directional_fees"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "=0.31.1", features = ["init-if-needed"] }
anchor-spl = "=0.31.1"
zeroize_derive = "=1.4.2"
