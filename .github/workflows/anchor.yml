name: Anchor program

on:
  push:
    branches: [main]
    paths:
      - "Anchor.toml"
      - "Cargo.toml"
      - "programs/**"
      - ".github/workflows/anchor.yml"
  pull_request:
    paths:
      - "Anchor.toml"
      - "Cargo.toml"
      - "programs/**"
      - ".github/workflows/anchor.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Restore Anchor CLI
        id: anchor-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/anchor
          key: anchor-cli-0.31.1-${{ runner.os }}-${{ runner.arch }}
      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v2.1.0/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Install Anchor CLI
        if: steps.anchor-cache.outputs.cache-hit != 'true'
        run: |
          cargo install --git https://github.com/coral-xyz/anchor --tag v0.31.1 anchor-cli --locked
      - name: Build verified program artifact
        shell: bash
        run: |
          set +e
          anchor build > anchor-build.log 2>&1
          status=$?
          cat anchor-build.log
          if [ "$status" -ne 0 ]; then
            summary=$(tail -n 80 anchor-build.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
            echo "::error title=Anchor build failed::$summary"
          fi
          exit "$status"
      - name: Upload program and IDL
        uses: actions/upload-artifact@v4
        with:
          name: directional-fees-${{ github.sha }}
          if-no-files-found: error
          path: |
            target/deploy/directional_fees.so
            target/idl/directional_fees.json
